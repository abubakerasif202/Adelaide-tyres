name: Verify

on:
  push:
    branches:
      - fix/tr545d-live-checkout
  pull_request:
    branches:
      - master

permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run verification suite
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set +e
          : > verification-output.txt
          failed=0
          run_check() {
            label="$1"
            shift
            echo "===== $label =====" | tee -a verification-output.txt
            "$@" 2>&1 | tee -a verification-output.txt
            code=${PIPESTATUS[0]}
            echo "===== exit $code =====" | tee -a verification-output.txt
            echo | tee -a verification-output.txt
            if [ "$code" -ne 0 ]; then failed=1; fi
          }
          run_check "UNIT TESTS" npm test
          run_check "TYPECHECK" npm run typecheck
          run_check "LINT" npm run lint
          run_check "PRODUCTION BUILD" npm run build
          exit "$failed"

      - name: Report verification failure
        if: steps.verify.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo "### Verification failed"
            echo
            echo '<details><summary>Command output</summary>'
            echo
            echo '```text'
            tail -n 350 verification-output.txt
            echo '```'
            echo '</details>'
          } > verification-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file verification-comment.md

      - name: Fail job when verification failed
        if: steps.verify.outcome == 'failure'
        run: exit 1
